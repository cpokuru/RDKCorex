{% extends "base.html" %}
{% block content %}
{% include "partials/hero.html" %}
<section class="section spec-document">
  {% for block in page.doc.blocks %}
    {% include "partials/block.html" %}
  {% endfor %}
</section>
{%- for key, definition in (page.doc.definitions or {}).items() %}
<template id="{{ key }}">
  {%- with block = definition %}{% include "partials/block.html" %}{% endwith %}
</template>
{%- endfor %}
{% endblock %}
{% block scripts %}
<div class="spec-modal" id="spec-modal" hidden>
  <div class="spec-modal-backdrop" data-modal-close></div>
  <div class="spec-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="spec-modal-title">
    <button class="spec-modal-close" type="button" data-modal-close aria-label="Close">&times;</button>
    <div class="spec-modal-body" id="spec-modal-body"></div>
  </div>
</div>
<script src="assets/js/spec-modal.js" defer></script>
<script src="assets/js/spec-filter.js" defer></script>
{% endblock %}
